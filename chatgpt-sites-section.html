<!-- NEXUS MC original-site integration: paste into Updates & Progress section. -->
<section id="nexus-mc-updates" aria-labelledby="nexus-updates-heading">
  <h2 id="nexus-updates-heading">UPDATES &amp; PROGRESS</h2>
  <div class="nexus-widgets">
    <article class="nexus-widget">
      <span class="nexus-version" id="version">Loading…</span>
      <span id="release-date"></span>
      <h3 id="release-title">Checking development history</h3>
      <div id="updates" aria-live="polite"></div>
    </article>
    <aside class="nexus-widget nexus-raid">
      <div class="nexus-eyebrow">LIVE FROM NEXUS MC</div>
      <h3 id="raid-name">Raid status</h3>
      <p id="raid-message">Connecting to Minecraft…</p>
      <dl class="nexus-stats">
        <div><dt>Status</dt><dd id="raid-state">Checking…</dd></div>
        <div><dt>Players</dt><dd id="raid-players">—</dd></div>
        <div><dt>Next Raid</dt><dd id="raid-next">—</dd></div>
      </dl>
      <small id="raid-updated">No verified data</small>
    </aside>
  </div>
</section>
<style>
#nexus-mc-updates .nexus-widgets{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:16px}
#nexus-mc-updates .nexus-widget{padding:24px;border:1px solid #50385a;background:#140e1d;color:#f5eafe}
#nexus-mc-updates .nexus-raid{background:#241331}
#nexus-mc-updates .nexus-version{display:inline-block;padding:7px 10px;margin-right:10px;background:#ffbe31;color:#1a0c21;font-weight:800}
#nexus-mc-updates .nexus-eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#cc80f5}
#nexus-mc-updates .nexus-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#nexus-mc-updates .nexus-stats div{padding:10px;background:#130b1d;min-width:0}
#nexus-mc-updates dt{font-size:12px;color:#b9a5cb}
#nexus-mc-updates dd{margin:4px 0 0;overflow-wrap:anywhere;font-weight:700}
#nexus-mc-updates #updates article{padding:12px 0;border-bottom:1px solid #50385a}
@media(max-width:800px){#nexus-mc-updates .nexus-widgets{grid-template-columns:1fr}#nexus-mc-updates .nexus-stats{grid-template-columns:1fr}}
</style>
<!-- Copy config.json, updates.json and widget.js alongside this snippet in the original site project, then include: -->
<script defer src="./widget.js"></script>
